<!-- =====================================================================
     통합_theme.html  ·  메-SRM 공용 디자인 & 테마 시스템 (Light / Dark)
     ---------------------------------------------------------------------
     사용법 : 각 모듈 index.html <head> 안, <meta charset> 바로 다음 &
              Bootstrap CSS <link> "앞"에 아래 한 줄로 인클루드
                  <?!= include('통합_theme'); ?>
     제공   : ① 첫 페인트 흰/검 번쩍임(FOUC) 방지
              ② CSS 변수 디자인 토큰 (라이트/다크 + 구 변수 별칭 호환)
              ③ 글로벌 헤더·Bootstrap·공용 컴포넌트 다크 보정
              ④ window.SRMTheme (apply/toggle/get) + 하위호환 applyTheme/toggleTheme
              ⑤ window.SRM 프론트 공용 헬퍼 (debounce/format*/renderRows/guard 등)
     주의   : 이 파일은 모든 모듈 GAS 프로젝트에 "동일 파일명(통합_theme)"으로
              복사되어야 하며, include 대상이므로 <!DOCTYPE>/<html>/<body> 금지.
     ===================================================================== -->
<script>
/* 0. FOUC 방지 — 본문 파싱 전에 테마를 <html>에 즉시 반영 -------------------------
   우선순위: URL ?srm_theme=dark|light  →  localStorage['srm-theme']  →  light
   (모듈 간 이동 시 통합_header 가 메뉴 링크에 ?srm_theme= 를 붙여 테마를 전달하며,
    GAS 각 모듈이 서로 다른 origin 이라 localStorage 가 공유되지 않는 문제를 보완) */
(function () {
  try {
    // 1) 서버 주입값(window.__SRM_THEME) — doGet(e).parameter.srm_theme 에서 옴 (모듈 간 이동)
    var s = (typeof window.__SRM_THEME === 'string') ? window.__SRM_THEME : '';
    // 2) URL 파라미터 (GAS iframe 밖에서 열리는 경우 대비)
    var q = '';
    try { q = new URLSearchParams(location.search).get('srm_theme') || ''; } catch (e) {}
    var hint = (s === 'dark' || s === 'light') ? s : ((q === 'dark' || q === 'light') ? q : '');
    // 3) 마지막으로 localStorage
    var t = hint || (localStorage.getItem('srm-theme') || 'light');
    try { localStorage.setItem('srm-theme', t); } catch (e) {}
    document.documentElement.setAttribute('data-srm-theme', t);
    if (t === 'dark') document.documentElement.classList.add('dark-theme');
  } catch (e) {}
})();
</script>

  font-weight:600;font-size:.82rem;line-height:1;padding:0 14px;height:29px;border-radius:999px;
  cursor:pointer;transition:all .15s ease;white-space:nowrap;}
.srm-segmented button:hover{color:var(--srm-text);}
.srm-segmented button.is-active{background:var(--srm-accent);color:var(--srm-accent-contrast);
  box-shadow:0 1px 2px rgba(0,0,0,.18);}
/* 리포트 표의 주요 지표 강조 (README §3-5) */
.srm-metric{color:var(--srm-accent)!important;font-weight:700!important;}

/* 다크 스크롤바 */
body.dark-theme ::-webkit-scrollbar{width:10px;height:10px;}
body.dark-theme ::-webkit-scrollbar-track{background:var(--srm-bg);}
body.dark-theme ::-webkit-scrollbar-thumb{background:var(--srm-border-strong);border-radius:5px;}
body.dark-theme ::-webkit-scrollbar-thumb:hover{background:var(--srm-text-muted);}
body.dark-theme *{scrollbar-color:var(--srm-border-strong) var(--srm-bg);}

/* =====================================================================
   6. 전문 분석 사이트 톤 — 전역 마감(양 테마 공통, 레이아웃 영향 없음)
   ===================================================================== */
html{ -webkit-text-size-adjust:100%; }
body{
  -webkit-font-smoothing:antialiased;
  -moz-osx-font-smoothing:grayscale;
  text-rendering:optimizeLegibility;
}
/* 숫자는 표·지표에서 자리 정렬(tabular) — 분석 화면 가독성 */
table, .data-table, .exchange-table, .partner-detail-table,
.srm-metric, [class*="val-"], [class*="-value"], [id*="sum-"]{
  font-variant-numeric:tabular-nums;
  font-feature-settings:"tnum" 1;
}
/* 선택 영역 · 포커스 링 — 브랜드 앰버 */
::selection{ background:var(--srm-accent); color:var(--srm-accent-contrast); }
body.dark-theme :focus-visible{ outline:2px solid var(--srm-accent); outline-offset:1px; }
/* 라이트 스크롤바도 얇게(일관성) */
:root:not(.dark-theme) ::-webkit-scrollbar{width:10px;height:10px;}
:root:not(.dark-theme) ::-webkit-scrollbar-thumb{background:#c4ccd6;border-radius:5px;}
:root:not(.dark-theme) ::-webkit-scrollbar-thumb:hover{background:#a9b3c0;}
:root:not(.dark-theme) ::-webkit-scrollbar-track{background:#eef1f5;}

/* 카드/패널 공통 미세 마감 — 얇은 테두리 + 절제된 그림자 (market-forecast 톤) */
body.dark-theme .card,
body.dark-theme .card-custom,
body.dark-theme .modal-content{ box-shadow:none; }
body.dark-theme hr{ border-color:var(--srm-border); opacity:1; }
body.dark-theme .badge.bg-secondary{ background:var(--srm-surface-2)!important; color:var(--srm-text)!important; }
body.dark-theme .spinner-border{ color:var(--srm-accent)!important; }
/* 다크에서 밝은 회백 배경 인라인(#fdfefe/#fdfdfd/#f8f9fa/#f1f3f5/#ffffff) → 서피스 톤.
   ※ #fff3cd(숫자필터 하이라이트) 같은 값과 충돌하지 않도록 완전 매칭만 대상 */
body.dark-theme [style*="background:#ffffff"], body.dark-theme [style*="background: #ffffff"],
body.dark-theme [style*="background-color:#ffffff"], body.dark-theme [style*="background-color: #ffffff"],
body.dark-theme [style*="background:#fdfefe"], body.dark-theme [style*="background-color:#fdfefe"],
body.dark-theme [style*="background:#fdfdfd"], body.dark-theme [style*="background-color:#fdfdfd"],
body.dark-theme [style*="background:#f8f9fa"], body.dark-theme [style*="background-color:#f8f9fa"],
body.dark-theme [style*="background:#f1f3f5"], body.dark-theme [style*="background-color:#f1f3f5"],
body.dark-theme [style*="background:#f0f8ff"], body.dark-theme [style*="background-color:#f0f8ff"]{
  background-color:var(--srm-surface-2)!important;
}
body.dark-theme [style*="rgba(255,255,255,0.8"],
body.dark-theme [style*="rgba(255, 255, 255, 0.8"],
body.dark-theme [style*="rgba(255,255,255,.8"],
body.dark-theme [style*="rgba(255,255,255,0.85"]{ background-color:var(--srm-overlay)!important; }
</style>
<script>
/* =====================================================================
   6. 테마 컨트롤러 + 공용 프론트 헬퍼  (window.SRMTheme / window.SRM)
   ===================================================================== */
(function (w, d) {
  var KEY = 'srm-theme';

  function current(){ try { return localStorage.getItem(KEY) || 'light'; } catch (e) { return 'light'; } }

  function apply(theme){
    var dark = theme === 'dark';
    if (d.body) d.body.classList.toggle('dark-theme', dark);
    d.documentElement.classList.toggle('dark-theme', dark);
    d.documentElement.setAttribute('data-srm-theme', dark ? 'dark' : 'light');
    try { localStorage.setItem(KEY, dark ? 'dark' : 'light'); } catch (e) {}

    /* 히어로 이미지 라이트/다크 스왑 (존재할 때만) */
    var li = d.getElementById('hero-image-light'), da = d.getElementById('hero-image-dark');
    if (li) li.style.display = dark ? 'none' : 'block';
    if (da) da.style.display = dark ? 'block' : 'none';

    /* 드롭다운 테마 토글 버튼 라벨 */
    var tb = d.getElementById('theme-toggle-btn');
    if (tb) tb.innerHTML = dark ? '테마설정: Light' : '테마설정: Dark';

    /* 모듈(차트/지도 등)이 반응하도록 이벤트 발행 */
    try { w.dispatchEvent(new CustomEvent('srm:themechange', { detail:{ theme: dark ? 'dark' : 'light' } })); } catch (e) {}
  }

  function toggle(){ apply(current() === 'dark' ? 'light' : 'dark'); }

  w.SRMTheme = { apply: apply, toggle: toggle, get: current };
  /* 하위호환 전역 (기존 header.html 들이 직접 호출) */
  w.applyTheme = apply;
  w.toggleTheme = toggle;

  if (d.readyState === 'loading') d.addEventListener('DOMContentLoaded', function(){ apply(current()); });
  else apply(current());

  /* ---------------- 공용 헬퍼 : window.SRM ---------------- */
  var SRM = w.SRM || {};

  SRM.onThemeChange = function (cb){
    w.addEventListener('srm:themechange', function (e){
      try { cb(e.detail.theme); } catch (err) { console.error('[SRM.onThemeChange]', err); }
    });
  };

  /* CSS 변수에서 현재 테마의 차트 색상 세트를 추출 */
  SRM.chartTheme = function (){
    var cs = getComputedStyle(d.documentElement);
    var v = function (n){ return cs.getPropertyValue(n).trim(); };
    return {
      palette: [v('--srm-chart-1'), v('--srm-chart-2'), v('--srm-chart-3'),
                v('--srm-chart-4'), v('--srm-chart-5'), v('--srm-chart-6')],
      grid: v('--srm-chart-grid'), tick: v('--srm-chart-tick'),
      accent: v('--srm-accent'), text: v('--srm-text'), surface: v('--srm-surface')
    };
  };

  SRM.debounce = function (fn, wait){
    var t; wait = wait || 150;
    return function (){
      var args = arguments, ctx = this;
      clearTimeout(t);
      t = setTimeout(function (){ fn.apply(ctx, args); }, wait);
    };
  };

  SRM.escapeHtml = function (s){
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (m){
      return ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' })[m];
    });
  };

  SRM.formatNumber = function (n, dp){
    var x = (typeof n === 'number') ? n : parseFloat(String(n).replace(/,/g, ''));
    if (!isFinite(x)) return (n == null ? '' : String(n));
    return x.toLocaleString('ko-KR', { maximumFractionDigits: dp == null ? 0 : dp });
  };

  SRM.formatCurrency = function (n, unit){
    var s = SRM.formatNumber(n, 0);
    return s + (unit ? ' ' + unit : '');
  };

  /* Date | 'yyyymmdd' | ISO 문자열 → 'yyyy-MM-dd' (withTime 시 시:분:초 추가) */
  SRM.formatDateString = function (input, withTime){
    if (input == null || input === '') return '';
    var dt = (input instanceof Date) ? input : new Date(input);
    if (isNaN(dt.getTime())) {
      var m = String(input).replace(/[^0-9]/g, '');
      if (m.length >= 8) dt = new Date(+m.slice(0,4), +m.slice(4,6) - 1, +m.slice(6,8));
    }
    if (isNaN(dt.getTime())) return String(input);
    var p = function (x){ return String(x).padStart(2, '0'); };
    var base = dt.getFullYear() + '-' + p(dt.getMonth() + 1) + '-' + p(dt.getDate());
    return withTime ? base + ' ' + p(dt.getHours()) + ':' + p(dt.getMinutes()) + ':' + p(dt.getSeconds()) : base;
  };

  /* DocumentFragment 로 대량 행을 단일 리플로우로 주입 (README §4-2) */
  SRM.renderRows = function (tbody, items, buildRow){
    if (!tbody) return;
    var frag = d.createDocumentFragment();
    for (var i = 0; i < items.length; i++) {
      var tr = buildRow(items[i], i);
      if (tr) frag.appendChild(tr);
    }
    if (tbody.replaceChildren) tbody.replaceChildren(frag);
    else { tbody.innerHTML = ''; tbody.appendChild(frag); }
  };

  /* 전역 에러 가드 — 특정 셀/모듈 손상 시에도 화면 전체가 멈추지 않도록 */
  SRM.guard = function (fn, onErr){
    try { return fn(); }
    catch (e) {
      console.error('[SRM.guard]', e);
      if (typeof onErr === 'function') { try { onErr(e); } catch (_) {} }
      return undefined;
    }
  };

  w.SRM = SRM;
})(window, document);
</script>
