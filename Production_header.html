    function renderHeaderUI(userEmail, moduleTitle) {
        let headerElement = document.getElementById('global-header');
        if (!headerElement) {
            headerElement = document.createElement('header');
            headerElement.id = 'global-header';
            document.body.insertBefore(headerElement, document.body.firstChild);
        }
        let displayName = 'USER';
        if (userEmail) {
            const userId = userEmail.split('@')[0];
            displayName = USER_NAME_MAP[userId] || userId.toUpperCase();
        }
        if (!window.initialConnectTime) {
            const now = new Date();
            const pad = (num) => String(num).padStart(2, '0');
            window.initialConnectTime = `${now.getFullYear()}-${pad(now.getMonth() + 1)}-${pad(now.getDate())} ${pad(now.getHours())}:${pad(now.getMinutes())}:${pad(now.getSeconds())}`;
        }
        const titleSuffix = moduleTitle ? `&nbsp;&nbsp;<span class="module-title">${moduleTitle}</span>` : '';
        let html = `
            <div class="header-title">삼성메디슨 구매그룹${titleSuffix}</div>
            <div class="header-buttons">
                <span class="user-info-text">${displayName}&nbsp;&nbsp;&nbsp;&nbsp;접속시간: ${window.initialConnectTime}</span>
                <div class="dropdown">
                    <button class="btn btn-outline-light btn-icon-menu" type="button" id="dropdownMenuButton" data-bs-toggle="dropdown" aria-expanded="false" title="전체 메뉴">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line>
                        </svg>
                    </button>
                    <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="dropdownMenuButton">
        `;
        MENU_GROUPS.forEach((group, index) => {
            group.forEach(link => {
                html += `<li><a class="dropdown-item" href="${link.url}" target="_blank">${link.title}</a></li>`;
            });
            if (index < MENU_GROUPS.length - 1) {
                html += `<li><hr class="dropdown-divider"></li>`;
            }
        });
        html += `
                    </ul>
                </div>
                <span class="confidential-text">Confidential</span>
            </div>
        `;
        headerElement.innerHTML = html;
    }
</script>
